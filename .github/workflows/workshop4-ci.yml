name: Workshop 4 - CI Pipeline

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'Workshop-4/**'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'Workshop-4/**'
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Workshop-4/frontend-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: Workshop-4/frontend-app/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

  java-backend:
    name: Java Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Workshop-4/java-backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: testdb
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Lint (Checkstyle)
        run: mvn checkstyle:check
        continue-on-error: true

      - name: Test
        run: mvn test
        env:
          MYSQL_URL: jdbc:mysql://localhost:3306/testdb
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpassword
          JWT_SECRET_KEY: test-secret-key

      - name: Build
        run: mvn clean package -DskipTests

  python-backend:
    name: Python Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Workshop-4/python-backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: poetry install

      - name: Lint (Flake8)
        run: poetry run flake8 src
        continue-on-error: true

      - name: Create test keys
        run: |
          mkdir -p keys
          ssh-keygen -t rsa -b 2048 -m PEM -f keys/private-key.pem -N ""
          openssl rsa -in keys/private-key.pem -pubout -outform PEM -out keys/public-key.pem

      - name: Test
        run: poetry run pytest tests/
        env:
          DATABASE_USER: testuser
          DATABASE_PASSWORD: testpassword
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: testdb

      - name: Build
        run: poetry build
